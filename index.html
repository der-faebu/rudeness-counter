<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rude-O-Meter</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Rude-O-Meter</h1>
      <p class="sub">Log it when someone is rude. Log it when they're nice too, and each nice act cancels one rude one. 
        Tap a name to set it. Once set, it can't be changed.</p>
    </div>
    <div class="status" id="status" role="status">Connecting…</div>
  </header>

  <div class="verdict" id="verdict">Nobody has been rude yet.</div>

  <div class="board">
    <div class="side" id="side-a"></div>
    <div class="vs" aria-hidden="true">vs</div>
    <div class="side" id="side-b"></div>
  </div>

  <section class="log" aria-labelledby="log-title">
    <div class="log-head">
      <h2 id="log-title">Match report</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter by person"></div>
    </div>
    <div class="days" id="days"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
